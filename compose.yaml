services:
  server:
    build:
      context: .
      args:
        PYTHON_VERSION: 3.12.10
    environment:
      HOST: 0.0.0.0
      PORT: "6969"
    ports:
      - "6969:6969"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6969/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
