[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-service"
version = "1.0.0"
description = "Vietnamese OCR service with FastAPI and ONNX Runtime"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.3.5",
    "opencv-python-headless==4.13.0.92",
    "onnxruntime==1.25.1",
    "Pillow==12.2.0",
    "pdfplumber==0.11.9",
    "shapely==2.1.2",
    "pyclipper==1.4.0",
    "ruamel.yaml==0.19.1",
    "six==1.17.0",
    "fastapi==0.136.1",
    "uvicorn==0.46.0",
    "python-multipart==0.0.27",
    "starlette==1.0.0",
    "pydantic==2.13.3",
    "pypdfium2==5.7.1",
]

[project.optional-dependencies]
cli = ["torch", "torchvision"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: inference with bundled models"]
